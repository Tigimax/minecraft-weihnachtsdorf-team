---
- name: Manage Pi-hole Internal DNS Records
  hosts: dns
  become: true
  vars:
    custom_list_src: "{{ playbook_dir }}/../../configs/pihole/custom.list"
    custom_list_dest: "/root/pihole/etc-pihole/custom.list"

  tasks:
    - name: Ensure Pi-hole etc directory exists
      ansible.builtin.file:
        path: /root/pihole/etc-pihole
        state: directory
        mode: '0755'

    - name: Deploy custom.list DNS records
      ansible.builtin.copy:
        src: "{{ custom_list_src }}"
        dest: "{{ custom_list_dest }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: Reload Pi-hole DNS

    - name: Flush handlers to reload DNS immediately
      ansible.builtin.meta: flush_handlers

    - name: Validate DNS resolution against local Pi-hole (@127.0.0.1)
      ansible.builtin.command: "dig @127.0.0.1 +short {{ item.host }}"
      loop:
        - { host: 'mc-node1.net', expected: '192.168.1.148' }
        - { host: 'mc-main.net', expected: '192.168.1.149' }
        - { host: 'idp-01.net', expected: '192.168.1.150' }
        - { host: 'auth.tigimax.mooo.com', expected: '192.168.1.174' }
        - { host: 'panel.tigimax.mooo.com', expected: '192.168.1.174' }
        - { host: 'map.tigimax.mooo.com', expected: '192.168.1.174' }
        - { host: 'plan.tigimax.mooo.com', expected: '192.168.1.174' }
        - { host: 'play.tigimax.mooo.com', expected: '192.168.1.174' }
        - { host: 'tigimax.mooo.com', expected: '192.168.1.174' }
      register: dns_check
      changed_when: false
      failed_when: dns_check.rc != 0 or (dns_check.stdout | trim) != item.expected

  handlers:
    - name: Reload Pi-hole DNS
      ansible.builtin.command: docker exec pihole pihole restartdns reload
      changed_when: true
