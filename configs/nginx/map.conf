# usrv01 (192.168.1.174) Nginx Reverse Proxy Configuration for BlueMap
# File: /etc/nginx/sites-available/default (snippet for map.tigimax.mooo.com)

server {
    if ($host = map.tigimax.mooo.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name map.tigimax.mooo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name map.tigimax.mooo.com;

    ssl_certificate /etc/letsencrypt/live/map.tigimax.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.tigimax.mooo.com/privkey.pem;

    # HTTP Basic Authentication (Passwortschranke)
    auth_basic "Weihnachtsdorf BlueMap Access";
    auth_basic_user_file /etc/nginx/.htpasswd_map;

    location / {
        proxy_pass http://192.168.1.148:8123;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
