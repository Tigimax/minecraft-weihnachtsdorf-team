# usrv01 (192.168.1.174) Nginx Reverse Proxy Configuration for BlueMap
# Location: /etc/nginx/conf.d/bluemap-method.conf & /etc/nginx/sites-available/default

# /etc/nginx/conf.d/bluemap-method.conf
# BlueMap's embedded HTTP server only implements GET/POST and returns 400 to HEAD requests.
# Nginx converts client HEAD requests to upstream GET and strips the response body per RFC 7231.
map $request_method $bluemap_method {
    HEAD GET;
    default $request_method;
}

# /etc/nginx/sites-available/default (snippet for map.tigimax.mooo.com)
server {
    if ($host = map.tigimax.mooo.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name map.tigimax.mooo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name map.tigimax.mooo.com;

    ssl_certificate /etc/letsencrypt/live/map.tigimax.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.tigimax.mooo.com/privkey.pem;

    # HTTP Basic Authentication (Passwortschranke: tigimax / Tigimaxx6555)
    auth_basic "Weihnachtsdorf BlueMap Access";
    auth_basic_user_file /etc/nginx/.htpasswd_map;

    location / {
        proxy_pass http://192.168.1.148:8123;
        proxy_method $bluemap_method;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
