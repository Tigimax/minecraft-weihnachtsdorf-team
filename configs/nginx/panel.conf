# usrv01 (192.168.1.174) Nginx Reverse Proxy Configuration for Pterodactyl Panel
# File: /etc/nginx/sites-available/default (snippet for panel.tigimax.mooo.com)

server {
    if ($host = panel.tigimax.mooo.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name panel.tigimax.mooo.com;

    if ($host !~* ^panel\.tigimax\.mooo\.com$) {
        return 444;
    }

    rewrite ^(.*) https://$host$1 permanent;
}

server {
    listen 443 ssl http2;
    server_name panel.tigimax.mooo.com;

    if ($host !~* ^panel\.tigimax\.mooo\.com$) {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/panel.tigimax.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.tigimax.mooo.com/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_redirect off;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;

        # Target: Pterodactyl Node 1 Panel
        proxy_pass http://192.168.1.148:80;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100m;
        client_body_timeout 120s;
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }
}
