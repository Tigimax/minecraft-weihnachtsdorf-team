# usrv01 (192.168.1.174) Nginx Reverse Proxy Configuration for Plan Analytics
# File: /etc/nginx/sites-available/default (snippet for plan.tigimax.mooo.com)

server {
    if ($host = plan.tigimax.mooo.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name plan.tigimax.mooo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name plan.tigimax.mooo.com;

    ssl_certificate /etc/letsencrypt/live/plan.tigimax.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan.tigimax.mooo.com/privkey.pem;

    include /etc/nginx/snippets/authentik-forward-auth.conf;

    location / {
        include /etc/nginx/snippets/authentik-protected.conf;

        proxy_pass http://192.168.1.149:8804;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
