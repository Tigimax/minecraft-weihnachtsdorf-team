# usrv01 (192.168.1.174) Nginx Reverse Proxy Configuration for Planka Kanban Board
# File: /etc/nginx/sites-available/default (snippet for tigimax.mooo.com)

server {
    listen 80;
    server_name tigimax.mooo.com kanban.net;
    return 301 https://tigimax.mooo.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tigimax.mooo.com;
    ssl_certificate /etc/letsencrypt/live/tigimax.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tigimax.mooo.com/privkey.pem;

    client_max_body_size 100M;

    include /etc/nginx/snippets/authentik-forward-auth.conf;

    location / {
        include /etc/nginx/snippets/authentik-protected.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
