# Pterodactyl Wings TLS Reverse Proxy for Node 1 (VM 119) and Node 2 (VM 120)

server {
    listen 8081 ssl;
    server_name panel.tigimax.mooo.com;

    ssl_certificate /etc/letsencrypt/live/panel.tigimax.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.tigimax.mooo.com/privkey.pem;

    location / {
        proxy_pass http://192.168.1.148:8080;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 0;
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }
}

