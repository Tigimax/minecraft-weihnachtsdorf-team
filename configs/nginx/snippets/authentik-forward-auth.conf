# Authentik forward_auth endpoint definition
# Included inside the server block of protected hosts

location /outpost.goauthentik.io {
    proxy_pass              http://192.168.1.150:9000/outpost.goauthentik.io;
    proxy_http_version      1.1;

    proxy_set_header        Host $http_host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Host $http_host;
    proxy_set_header        X-Forwarded-Uri $request_uri;
    proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;

    proxy_buffering         off;
    proxy_read_timeout      86400s;
    proxy_send_timeout      86400s;
}

location = /outpost.goauthentik.io/auth/nginx {
    internal;
    proxy_pass              http://192.168.1.150:9000/outpost.goauthentik.io/auth/nginx;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_http_version      1.1;

    proxy_set_header        Host $http_host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Host $http_host;
    proxy_set_header        X-Forwarded-Uri $request_uri;
    proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
}

location @authentik_signin {
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}
