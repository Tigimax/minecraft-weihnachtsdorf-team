[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wd-identity"
version = "1.0.0"
description = "Weihnachtsdorf 7 Identity Management, SSO & Minecraft Synchronization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ldap3>=2.9.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "discord.py>=2.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.scripts]
wd-admin = "wd_identity.cli:cli"
mc-admin-sync = "wd_identity.mc_sync:main"

[tool.setuptools.packages.find]
include = ["wd_identity*"]
